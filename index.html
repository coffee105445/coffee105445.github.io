<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宋海康 · 个人名片</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --c1: #6a5cff;
        --c2: #9d4edd;
        --ink: #2b2d42;
        --muted: #7b7f9e;
    }

    html, body { height: 100%; }

    body {
        font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f067a4 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 28px;
        overflow: hidden;
        position: relative;
    }

    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: .55;
        animation: float 14s ease-in-out infinite;
    }
    .blob.b1 { width: 320px; height: 320px; background: #ffd86b; top: -80px; left: -60px; }
    .blob.b2 { width: 360px; height: 360px; background: #4cc9f0; bottom: -120px; right: -80px; animation-delay: -7s; }
    @keyframes float {
        0%,100% { transform: translate(0,0) scale(1); }
        50%     { transform: translate(30px,-25px) scale(1.12); }
    }

    .card {
        position: relative;
        z-index: 2;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(8px);
        width: 100%;
        max-width: 430px;
        border-radius: 26px;
        box-shadow: 0 30px 70px rgba(40, 20, 80, .35), 0 4px 14px rgba(0,0,0,.12);
        overflow: hidden;
        text-align: center;
        animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise {
        from { opacity: 0; transform: translateY(36px) scale(.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cover {
        height: 132px;
        background: linear-gradient(120deg, var(--c1), var(--c2));
        position: relative;
        overflow: hidden;
    }
    .cover::before, .cover::after {
        content: ""; position: absolute; border-radius: 50%;
        background: rgba(255,255,255,.18);
    }
    .cover::before { width: 120px; height: 120px; top: -46px; right: -26px; }
    .cover::after  { width: 70px; height: 70px; bottom: -24px; left: 28px; }

    .avatar-wrap {
        position: relative;
        width: 122px; height: 122px;
        margin: -61px auto 0;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        box-shadow: 0 12px 28px rgba(90, 50, 160, .32);
    }
    .avatar {
        width: 100%; height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #f3f3f7;
        border: 4px solid #fff;
        display: block;
    }

    .info { padding: 18px 34px 34px; }

    h1 { font-size: 27px; color: var(--ink); margin: 14px 0 8px; letter-spacing: 1px; }

    .job {
        display: inline-block;
        font-size: 13px; font-weight: 600;
        color: var(--c1);
        background: rgba(106,92,255,.12);
        padding: 5px 16px;
        border-radius: 999px;
        margin-bottom: 18px;
    }

    .bio { color: var(--muted); font-size: 14px; line-height: 1.9; margin-bottom: 26px; }

    .contact { display: flex; flex-direction: column; gap: 11px; text-align: left; }
    .contact a {
        display: flex; align-items: center; gap: 14px;
        padding: 12px 16px;
        background: #f7f8fc;
        border: 1px solid #eceef6;
        border-radius: 14px;
        color: var(--ink); text-decoration: none;
        font-size: 14px;
        transition: transform .25s, box-shadow .25s, background .25s, border-color .25s;
    }
    .contact a:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px rgba(90,50,160,.16);
        background: #fff;
        border-color: var(--c1);
    }
    .ico {
        flex: 0 0 34px; width: 34px; height: 34px;
        border-radius: 10px;
        display: grid; place-items: center;
    }
    .ico svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }
    .ico.mail { background: linear-gradient(135deg,#ff6b6b,#f06595); }
    .ico.wechat{ background: linear-gradient(135deg,#2ecc71,#27ae60); }
    .ico.qq   { background: linear-gradient(135deg,#4dabf7,#228be6); }
    .meta { display: flex; flex-direction: column; line-height: 1.35; }
    .label { font-size: 12px; color: var(--muted); }
    .value { font-weight: 600; letter-spacing: .3px; }

    .foot {
        margin-top: 22px; font-size: 11px; color: #b6bad0; letter-spacing: 2px;
    }

    @media (max-width: 420px) {
        .info { padding: 16px 22px 26px; }
    }
    .hometown-btn {
      display: block;
      margin-top: 18px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 1px;
      text-align: center;
      transition: transform .2s, box-shadow .2s;
    }
    .hometown-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(17, 153, 142, 0.4);
    }
</style>
</head>
