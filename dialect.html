<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家乡话 · 益阳</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: linear-gradient(135deg, #ff9a56, #ff6a88);
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 16px;
    }
    .card {
        background: rgba(255,255,255,.96);
        width: 100%;
        max-width: 900px;
        border-radius: 28px;
        padding: 40px 32px;
        box-shadow: 0 30px 80px rgba(0,0,0,.35);
        animation: fadeUp .8s ease;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    h1 {
        text-align: center;
        font-size: 28px;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #ff9a56, #ff6a88);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }
    .sub { text-align: center; font-size: 13px; color: #9aa3b8; margin-bottom: 26px; }

    /* ===== 左右两栏布局 ===== */
    .layout {
        display: flex;
        gap: 24px;
        align-items: flex-start;
    }
    .col-left {
        flex: 1;
        min-width: 0;
    }
    .col-right {
        flex: 1;
        min-width: 0;
    }
    .col-title {
        font-size: 16px;
        font-weight: bold;
        color: #ff6a88;
        margin-bottom: 14px;
        padding-left: 10px;
        border-left: 4px solid #ff8a65;
    }

    .word {
        background: #fff6f2;
        border-radius: 16px;
        padding: 14px 18px;
        margin-bottom: 10px;
        border-left: 4px solid #ff8a65;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .word .dialect { font-size: 16px; font-weight: bold; color: #ff6a88; }
    .word .meaning { font-size: 13px; color: #5a5f7a; }

    .note {
        background: #fff6f2;
        border-radius: 16px;
        padding: 18px 20px;
        margin-top: 18px;
    }
    .note p { font-size: 14px; line-height: 1.9; color: #5a5f7a; }
    .hl { color: #ff6a88; font-weight: bold; }
    .footer { text-align: center; margin-top: 26px; }
    .back {
        display: inline-block;
        padding: 11px 30px;
        background: linear-gradient(135deg, #6a5cff, #9d4edd);
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        font-size: 14px;
        transition: transform .2s, box-shadow .2s;
    }
    .back:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(106,92,255,.35); }

    /* 窄屏自动变单栏 */
    @media (max-width: 700px) {
        .layout { flex-direction: column; }
    }
</style>
</head>
<body>
    <div class="card">
        <h1>️ 益阳话</h1>
        <p class="sub">湘语长益片 · 软糯带江湖气</p >

        <div class="layout">
            <!-- 左侧：方言词汇表 -->
            <div class="col-left">
                <div class="col-title">常用词汇</div>
                <div class="word"><span class="dialect">恰饭</span><span class="meaning">吃饭</span></div>
                <div class="word"><span class="dialect">恰过饭冒</span><span class="meaning">吃过饭了吗</span></div>
                <div class="word"><span class="dialect">莫得</span><span class="meaning">没有</span></div>
                <div class="word"><span class="dialect">晓得</span><span class="meaning">知道</span></div>
                <div class="word"><span class="dialect">么子</span><span class="meaning">什么</span></div>
                <div class="word"><span class="dialect">克哪哈</span><span class="meaning">去哪里</span></div>
                <div class="word"><span class="dialect">蛮好</span><span class="meaning">很好</span></div>
                <div class="word"><span class="dialect">孩子</span><span class="meaning">鞋子（读 hái zi）</span></div>

                <div class="note">
                    <p>益阳话语调软糯，尾音常带上扬的调子，一句「<span class="hl">恰过饭冒</span>」，就是最地道的益阳招呼，听着亲切又热络。</p >
                </div>
            </div>

            <!-- 右侧：四格漫画 -->
            <div class="col-right">
                <div class="col-title">方言乌龙 · 我的"孩子"不见了</div>
                <img src="comic.jpg" alt="益阳话四格漫画" style="width:100%;border-radius:14px;display:block;">
            </div>
        </div>

        <div class="footer">
            <a class="back" href="hometown.html ">← 返回家乡页</a >
        </div>
    </div>
</body>
</html>
