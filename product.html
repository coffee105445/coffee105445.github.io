<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物产风光 · 益阳</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 16px;
}
.card {
    background: rgba(255,255,255,.96);
    width: 100%;
    max-width: 460px;
    border-radius: 28px;
    padding: 40px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,.35);
}
h1 {
    text-align: center;
    font-size: 28px;
    letter-spacing: 3px;
    color: #11998e;
    margin-bottom: 26px;
}
.item {
    background: #f4fbf7;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    border-left: 4px solid #38ef7d;
}
.item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 14px;
    display: block;
}
.item h2 { font-size: 15px; color: #11998e; margin-bottom: 8px; }
.item p { font-size: 14px; line-height: 1.9; color: #5a5f7a; }
.hl { color: #11998e; font-weight: bold; }
.footer { text-align: center; margin-top: 26px; }
.back {
    display: inline-block;
    padding: 11px 30px;
    background: linear-gradient(135deg, #6a5cff, #9d4edd);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="card">
<h1>物产风光</h1>

<div class="item">
<img src="img/tea.jpg" alt="安化黑茶">
<h2>安化黑茶</h2>
<p>益阳安化是<span class="hl">黑茶之源</span>，千两茶、茯砖茶闻名海内外，制作技艺已入选联合国人类非物质文化遗产名录。</p >
</div>

<div class="item">
<img src="img/bamboo.jpg" alt="桃江竹海">
<h2>桃江竹海</h2>
<p>桃江县楠竹林面积达百万亩，<span class="hl">全球约60%的楠竹产品</span>来自这里，竹海连绵、竹楼人家，是避暑胜地。</p >
</div>

<div class="item">
<img src="img/crab.jpg" alt="大通湖大闸蟹">
<h2>大通湖大闸蟹</h2>
<p>大通湖是湖南最大的内陆湖泊之一，湖水清澈、水草丰茂，出产的<span class="hl">大闸蟹膏满黄肥</span>，是湖南地理标志产品。</p >
</div>

<div class="item">
<img src="img/rice.jpg" alt="南县稻虾米">
<h2>南县稻虾米</h2>
<p>南县推行「稻虾共作」生态模式，产出的稻虾米<span class="hl">晶莹软糯、米香浓郁</span>，同时小龙虾个大肉嫩，一田双收。</p >
</div>

<div class="item">
<img src="img/wetland.jpg" alt="南洞庭湿地">
<h2>南洞庭湿地</h2>
<p>南洞庭湖湿地拥有亚洲最大的连片芦苇荡，秋冬时节芦花似雪，是候鸟迁徙的重要驿站。</p >
</div>

<div class="footer">
<a class="back" href="hometown.html ">← 返回家乡页</a >
</div>
</div>
</body>
</html>
